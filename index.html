<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Bernoulli y Efecto Venturi - Hidráulica y Neumática</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --warning: #ef4444;
      --success: #22c55e;
      --gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 1180px;
      width: 100%;
      background: var(--panel-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 24px;
      color: var(--accent);
    }
    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }
    .btn-preset {
      background: var(--gold);
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-preset:hover { opacity: 0.9; transform: scale(1.02); }
    .canvas-wrapper {
      position: relative;
      background: #090d16;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 320px;
    }
    .cavitation-banner {
      display: none;
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.92);
      color: #fff;
      padding: 8px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.06); }
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 850px) {
      .grid { grid-template-columns: 1fr; }
    }

      background: #0f172a;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #334155;
